name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Pin Lighthouse to Playwright Chromium
        run: |
          CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budgets
        run: npm run check:perf

      - name: Browser tests
        run: npm run test:e2e

      - name: Lighthouse
        run: npm run test:lighthouse

